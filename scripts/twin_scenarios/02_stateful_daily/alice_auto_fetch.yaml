name: "Alice Sales Full-Loop Business Audit"
mode: "fanout"
description: "Verify complete sales loop: Intake -> AI Analysis -> Competitor Strategy -> State Transition."

hooks:
  before_auth:
    - type: "python_function"
      module: "scripts.setup_personas"
      function: "setup_alice"

auth:
  url: "/#/auth"
  user: "alice@archon.com"
  password: "qwer45tyuiop"

resolution:
  width: 375
  height: 812

steps:
  - action: "goto"
    url: "/#/marketing"
    wait_until: "domcontentloaded"
    timeout: 45000

  - action: "wait_selector"
    selector: "h2:has-text('RUCKUS Networks')"
    timeout: 30000

  - action: "scroll_into_view"
    selector: "h2:has-text('RUCKUS Networks')"

  - action: "click"
    selector: "button[aria-label*='Generate AI Pitch']"
    force: true

  - action: "wait_selector"
    selector: "h3:has-text('AI Pitch')"
    timeout: 30000

  - action: "click"
    selector: "button[aria-label='Close Pitch Generator']"

  - action: "click"
    selector: "button[aria-label='Accept Lead']"

  - action: "goto"
    url: "/#/sales-cart"
    wait_until: "domcontentloaded"
    timeout: 30000

  - action: "wait_selector"
    selector: "h3:has-text('RUCKUS Networks')"
    timeout: 30000

  - action: "click"
    selector: "button:has-text('Promote')"
    timeout: 10000

  - action: "sleep"
    duration: 3000

analysis:
  type: "static"
  success_message: "WORKFLOW_SUCCESS"
