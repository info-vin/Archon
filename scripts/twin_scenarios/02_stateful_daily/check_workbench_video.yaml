name: "Check Workbench Video Rendering"
mode: "action"
description: "Logs in as Bob (Marketing), clicks a Victory Feed item, opens Workbench, and verifies the video element exists."

auth:
  url: "/#/auth"
  user: "bob@archon.com"
  password: "qwer45tyuiop"

steps:
  - action: "goto"
    url: "/#/brand"
    wait_until: "domcontentloaded"
    timeout: 30000

  - action: "sleep"
    duration: 3000

  - action: "click"
    selector: 'button:has-text("Workbench")'

  - action: "sleep"
    duration: 3000

  - action: "click"
    selector: 'h4:has-text("Neogence")'

  - action: "sleep"
    duration: 5000

  - action: "wait_selector"
    selector: "video"
    timeout: 10000

  - action: "sleep"
    duration: 5000

analysis:
  dom_extract_length: 5000
  screenshot: true
  system_prompt: |
    你是一位精準的工作流診斷員 Digital Twin Scout v39.1。
    任務：診斷 Bob 的 Workbench 中的 Librarian Knowledge Base 是否成功渲染影片。
    只要截圖中出現了影片播放器，就代表渲染成功，此時必須回傳 [WORKFLOW_SUCCESS]。
    重要提示：因為測試是在無頭瀏覽器 (Headless) 中進行，HTML5 影片通常不會載入封面且會隱藏控制列，因此在 REF 面板區塊內，只要看到一個「帶有圓角的純黑色或深色矩形區塊（佔據畫面一定寬度）」，這就是影片容器，請直接判定為渲染成功。
    重要規定：請務必全程使用繁體中文（zh-TW）撰寫報告，絕對不可使用簡體中文。
