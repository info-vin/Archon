name: "Bob Daily Market Report E2E Verification"
mode: "fanout"
description: "Verify that daily market report is generated by scheduler, loads correctly on Bob's Brand Hub, and can be edited in the Workbench."

hooks:
  before_auth:
    - type: "python_function"
      module: "scripts.setup_bob_report"
      function: "setup"

auth:
  url: "/#/auth"
  user: "bob@archon.com"
  password: "qwer45tyuiop"

resolution:
  width: 1280
  height: 720

steps:
  - action: "goto"
    url: "/#/brand"
    wait_until: "domcontentloaded"
    timeout: 45000

  - action: "click"
    selector: "button:has-text('Insights')"
    timeout: 10000


  - action: "wait_selector"
    selector: "h4:has-text('Daily Market Intelligence')"
    timeout: 30000

  - action: "click"
    selector: "div:has(h4:has-text('Daily Market Intelligence')) button[aria-label='Edit Content']"
    force: true
    timeout: 10000

  - action: "wait_selector"
    selector: "input[aria-label='Article title']"
    timeout: 15000

  - action: "click"
    selector: "button:has-text('Save Draft')"
    timeout: 10000

  - action: "sleep"
    duration: 3000

analysis:
  type: "static"
  success_message: "WORKFLOW_SUCCESS"
