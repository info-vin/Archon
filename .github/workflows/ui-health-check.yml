name: Web UI Health Check

on:
  push:
    branches: [ feat/twins ]
  schedule:
    # 每個整點執行一次 (台灣時間 +8 也是整點)
    - cron: '0 * * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Run Web Health Check
        working-directory: ./python
        run: |
          PYTHONPATH=$PYTHONPATH:$(pwd)/src uv run python ../scripts/web_health_check.py

      - name: Send Telegram Notification on Failure
        if: failure() && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != ''
        uses: appleboy/telegram-action@master
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        with:
          to: ${{ env.TELEGRAM_TO }}
          token: ${{ env.TELEGRAM_TOKEN }}
          message: |
            🚨 Archon Web UI Health Check Failed!

            - Repository: ${{ github.repository }}
            - Action Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Event: ${{ github.event_name }}
            
            Please check Vercel deployments and backend status immediately.
