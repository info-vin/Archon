name: Web UI Health Check

on:
  push:
    branches: [ feat/twins ]
  schedule:
    # 每個整點執行一次 (台灣時間 +8 也是整點)
    - cron: '0 * * * *'
  workflow_dispatch: # 允許手動觸發

jobs:
  health-check:
    runs-on: ubuntu-latest
    steps:
      - name: Test Admin UI Status
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://archon-jet.vercel.app/)
            echo "Attempt $i: Admin UI HTTP Status: $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Admin UI check successful."
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "🚨 Admin UI check failed after 5 attempts!"
              exit 1
            fi
            sleep 10
          done

      - name: Test End-user UI Status
        run: |
          for i in {1..5}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://archon-enduser.vercel.app/)
            echo "Attempt $i: End-user UI HTTP Status: $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ End-user UI check successful."
              break
            fi
            if [ "$i" -eq 5 ]; then
              echo "🚨 End-user UI check failed after 5 attempts!"
              exit 1
            fi
            sleep 10
          done

      - name: Send Telegram Notification on Failure
        if: failure() && env.TELEGRAM_TOKEN != '' && env.TELEGRAM_TO != ''
        uses: appleboy/telegram-action@master
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_TO: ${{ secrets.TELEGRAM_TO }}
        with:
          to: ${{ env.TELEGRAM_TO }}
          token: ${{ env.TELEGRAM_TOKEN }}
          message: |
            🚨 Archon Web UI Health Check Failed!

            - Repository: ${{ github.repository }}
            - Action Run URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            - Event: ${{ github.event_name }}
            
            Please check Vercel deployments and backend status immediately.
