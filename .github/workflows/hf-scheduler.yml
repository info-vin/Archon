name: Hugging Face Space Scheduler

on:
  schedule:
    # 每天台灣時間凌晨 00:18 暫停 (UTC 16:18)
    - cron: '18 16 * * *'
    # 每天台灣時間早上 06:42 啟動 (UTC 22:42)
    - cron: '42 22 * * *'
  # 允許手動觸發測試
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        default: 'restart'
        type: choice
        options:
          - restart
          - pause
 
jobs:
  manage-space:
    runs-on: ubuntu-latest
    steps:
      - name: Perform Action
        run: |
          USERNAME="chiawei6"
          SPACE_NAME="myrmidon"
          
          # 如果是排程觸發，判斷當前小時來決定動作
          if [ "${{ github.event_name }}" == "schedule" ]; then
            HOUR=$(date -u +%H)
            if [ "$HOUR" == "16" ]; then
              ACTION="pause"
            elif [ "$HOUR" == "22" ] || [ "$HOUR" == "00" ]; then
              ACTION="restart"
            else
              echo "Unexpected scheduled time: $HOUR. Exiting."
              exit 0
            fi
          # 如果是手動觸發，使用輸入的參數
          else
            ACTION="${{ inputs.action }}"
          fi

          echo "Attempting to $ACTION the space $USERNAME/$SPACE_NAME..."

          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            "https://huggingface.co/api/spaces/$USERNAME/$SPACE_NAME/$ACTION" \
            -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}")

          cat response.txt
          echo ""
          
          if [ "$RESPONSE" == "200" ] || [ "$RESPONSE" == "201" ] || [ "$RESPONSE" == "202" ]; then
            echo "Successfully executed $ACTION."
          else
            echo "Failed to $ACTION. HTTP Status: $RESPONSE"
            exit 1
          fi
