<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
        </linearGradient>
    </defs>
    
    <!-- 核心神經網路連線 (移除濾鏡，使用實色) -->
    <g stroke="url(#grad1)" stroke-width="3" opacity="0.8">
        <line x1="100" y1="100" x2="70" y2="70" />
        <line x1="100" y1="100" x2="130" y2="70" />
        <line x1="100" y1="100" x2="60" y2="130" />
        <line x1="100" y1="100" x2="140" y2="130" />
        <line x1="100" y1="100" x2="100" y2="40" />
        <line x1="70" y1="70" x2="100" y2="40" />
        <line x1="130" y1="70" x2="100" y2="40" />
        <line x1="60" y1="130" x2="80" y2="160" />
        <line x1="140" y1="130" x2="120" y2="160" />
        <line x1="70" y1="70" x2="60" y2="130" />
        <line x1="130" y1="70" x2="140" y2="130" />
    </g>

    <!-- 節點 (移除動畫，保持靜態) -->
    <circle cx="100" cy="100" r="14" fill="url(#grad1)" />
    <circle cx="70" cy="70" r="10" fill="url(#grad1)" />
    <circle cx="130" cy="70" r="10" fill="url(#grad1)" />
    <circle cx="60" cy="130" r="8" fill="url(#grad1)" />
    <circle cx="140" cy="130" r="8" fill="url(#grad1)" />
    <circle cx="80" cy="160" r="6" fill="url(#grad1)" />
    <circle cx="120" cy="160" r="6" fill="url(#grad1)" />
    <circle cx="100" cy="40" r="8" fill="url(#grad1)" />
</svg>