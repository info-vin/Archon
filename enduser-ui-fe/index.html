<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo-eciton-favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archon Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'background': 'hsl(var(--background))',
              'foreground': 'hsl(var(--foreground))',
              'card': 'hsl(var(--card))',
              'card-foreground': 'hsl(var(--card-foreground))',
              'popover': 'hsl(var(--popover))',
              'popover-foreground': 'hsl(var(--popover-foreground))',
              'primary': 'hsl(var(--primary))',
              'primary-foreground': 'hsl(var(--primary-foreground))',
              'secondary': 'hsl(var(--secondary))',
              'secondary-foreground': 'hsl(var(--secondary-foreground))',
              'muted': 'hsl(var(--muted))',
              'muted-foreground': 'hsl(var(--muted-foreground))',
              'accent': 'hsl(var(--accent))',
              'accent-foreground': 'hsl(var(--accent-foreground))',
              'destructive': 'hsl(var(--destructive))',
              'destructive-foreground': 'hsl(var(--destructive-foreground))',
              'border': 'hsl(var(--border))',
              'input': 'hsl(var(--input))',
              'ring': 'hsl(var(--ring))',
            },
            borderRadius: {
              lg: `0.5rem`,
              md: `calc(0.5rem - 2px)`,
              sm: `calc(0.5rem - 4px)`,
            },
          }
        }
      }
    </script>
     <style>
      :root {
        /* Light mode variables - synced with archon-ui-main */
        --background: 0 0% 98%;
        --foreground: 240 10% 3.9%;
        --muted: 240 4.8% 95.9%;
        --muted-foreground: 240 3.8% 46.1%;
        --popover: 0 0% 100%;
        --popover-foreground: 240 10% 3.9%;
        --border: 240 5.9% 90%;
        --input: 240 5.9% 90%;
        --card: 0 0% 100%;
        --card-foreground: 240 10% 3.9%;
        --primary: 271 91% 65%;
        --primary-foreground: 0 0% 100%;
        --secondary: 240 4.8% 95.9%;
        --secondary-foreground: 240 5.9% 10%;
        --accent: 271 91% 65%;
        --accent-foreground: 0 0% 100%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --ring: 240 5.9% 10%;
        --radius: 0.5rem;

        /* Tron accent colors */
        --purple-accent: 271 91% 65%;
        --green-accent: 160 84% 39%;
        --pink-accent: 330 90% 65%;
        --blue-accent: 217 91% 60%;
      }
      .dark {
        /* Dark mode variables - synced with archon-ui-main */
        --background: 0 0% 0%;
        --foreground: 0 0% 100%;
        --muted: 240 4% 16%;
        --muted-foreground: 240 5% 65%;
        --popover: 0 0% 0%;
        --popover-foreground: 0 0% 100%;
        --border: 240 3.7% 15.9%;
        --input: 240 3.7% 15.9%;
        --card: 0 0% 0%;
        --card-foreground: 0 0% 100%;
        --primary: 271 91% 65%;
        --primary-foreground: 0 0% 100%;
        --secondary: 240 3.7% 15.9%;
        --secondary-foreground: 0 0% 98%;
        --accent: 271 91% 65%;
        --accent-foreground: 0 0% 100%;
        --destructive: 0 84.2% 60.2%;
        --destructive-foreground: 0 0% 98%;
        --ring: 240 3.7% 15.9%;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.1.1/",
    "react": "https://esm.sh/react@^19.1.1",
    "react-dom/": "https://esm.sh/react-dom@^19.1.1/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.8.1",
    "d3": "https://esm.sh/d3@^7.9.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.45.0",
    "react-markdown": "https://esm.sh/react-markdown@9.0.1",
    "framer-motion": "https://esm.sh/framer-motion@11.0.8"
  }
}
</script>
</head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
